services:
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: .env
    expose: ["8000"]            # наружу НЕ публикуется, доступен только через nginx
    mem_limit: 1500m
    cpus: 2
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    depends_on: [backend]
    ports: ["80:80"]            # для HTTPS добавьте "443:443" и тома, см. README
    restart: unless-stopped
