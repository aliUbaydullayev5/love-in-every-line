limit_req_zone $binary_remote_addr zone=draw:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    # за Cloudflare Tunnel: реальный IP посетителя из CF-Connecting-IP (доверяем только docker-сетям)
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'" always;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/draw {
        limit_req zone=draw burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /strokes.json {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;  # SPA: /studio
    }
}
